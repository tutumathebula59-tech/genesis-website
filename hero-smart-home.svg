<rect x="360" y="440" width="230" height="16" rx="5" fill="#6b4a2e"/><rect x="376" y="456" width="10" height="26" fill="#4a3320"/><rect x="564" y="456" width="10" height="26" fill="#4a3320"/>
<rect x="450" y="424" width="22" height="16" rx="3" fill="#e8eef2"/><path d="M472 428h6v8h-6" fill="none" stroke="#e8eef2" stroke-width="2"/>
