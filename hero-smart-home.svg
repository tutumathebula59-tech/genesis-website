<rect x="518" y="352" width="96" height="26" rx="12" fill="#3d3d5c"/><rect x="596" y="352" width="24" height="72" rx="11" fill="#3d3d5c"/><rect x="590" y="418" width="40" height="12" rx="6" fill="#111"/>
