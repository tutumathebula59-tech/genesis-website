<rect x="518" y="290" width="52" height="74" rx="20" fill="#f08a5d"/>
<circle cx="544" cy="264" r="22" fill="#a86f4f"/><path d="M520 262c0-26 48-26 48 0v22c-6-10-6-24-6-24-10-6-28-6-36 0 0 0 0 14-6 24z" fill="#1c1410"/>
<path d="M526 312l-22 30h34" stroke="#a86f4f" stroke-width="12" stroke-linecap="round" fill="none"/>
