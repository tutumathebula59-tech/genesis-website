<circle cx="650" cy="165" r="190" fill="#4ecdc4" opacity=".05"/>
<rect x="520" y="80" width="260" height="175" rx="14" fill="url(#panel)" stroke="#4ecdc4" stroke-width="3"/>
<text x="540" y="108" fill="#4ecdc4" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">GENESIS</text>
<text x="745" y="108" fill="#9aa8b3" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">21:45</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8eef2">
<rect x="538" y="122" width="68" height="52" rx="8" fill="#17323a"/><circle cx="560" cy="142" r="8" fill="#facc15"/><text x="545" y="165">Lights</text>
<rect x="615" y="122" width="68" height="52" rx="8" fill="#17323a"/><text x="632" y="148" font-size="17" font-weight="700" fill="#4ecdc4">22°</text><text x="623" y="165">Climate</text>
<rect x="692" y="122" width="68" height="52" rx="8" fill="#17323a"/><rect x="717" y="132" width="18" height="14" rx="3" fill="#7ff0a6"/><text x="699" y="165">Security</text>
<rect x="538" y="182" width="68" height="52" rx="8" fill="#17323a"/><path d="M566 190l-8 16h8l-4 14 12-18h-8l4-12z" fill="#facc15"/><text x="545" y="228">Energy</text>
<rect x="615" y="182" width="145" height="52" rx="8" fill="#17323a"/><rect x="627" y="200" width="120" height="6" rx="3" fill="#2b4d57"/><rect x="627" y="200" width="78" height="6" rx="3" fill="#4ecdc4"/><circle cx="705" cy="203" r="7" fill="#fff"/><text x="627" y="224">Living room  65%</text>
</g>
<!-- wifi arcs -->
<g fill="none" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M650 62a22 22 0 0 1 30 0"/><path d="M640 52a36 36 0 0 1 50 0"/></g><circle cx="665" cy="70" r="3" fill="#4ecdc4"/>
