<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Family relaxing in a smart living room with a wall-mounted touch control panel">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2833"/><stop offset="1" stop-color="#121920"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d33"/><stop offset="1" stop-color="#1f4f6b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2630"/><stop offset="1" stop-color="#08141b"/></linearGradient>
</defs>
<rect width="900" height="520" fill="url(#wall)"/>
<rect y="400" width="900" height="120" fill="#2b2118"/>
<rect y="396" width="900" height="6" fill="#1a130d"/>
<!-- window -->
<rect x="40" y="70" width="190" height="210" rx="6" fill="url(#sky)" stroke="#33414f" stroke-width="6"/>
<path d="M135 70v210M40 175h190" stroke="#33414f" stroke-width="4"/>
<circle cx="90" cy="115" r="14" fill="#f4f1d0"/><circle cx="182" cy="140" r="2" fill="#fff"/><circle cx="70" cy="210" r="2" fill="#fff"/><circle cx="195" cy="100" r="2" fill="#fff"/>
<path d="M40 280 L70 230 L110 270 L150 215 L230 280Z" fill="#0c1a26" opacity=".8"/>
