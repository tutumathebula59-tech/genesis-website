<path d="M80 400q-20-60 10-90M80 400q10-70 40-80M80 400q30-40 20-90" stroke="#2f7d4f" stroke-width="10" stroke-linecap="round" fill="none"/>
<path d="M58 400h44l-6 56H64z" fill="#7a4a35"/>
<!-- ceiling sensor -->
<circle cx="400" cy="16" r="9" fill="#e8eef2"/><circle cx="400" cy="16" r="3" fill="#4ecdc4"/>
